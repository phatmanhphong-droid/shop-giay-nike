version: '3.8'

services:
  # DỊCH VỤ BACKEND REST API (NODE.JS)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: shop-nike-backend:latest
    container_name: shop-nike-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
    volumes:
      # Lưu trữ dữ liệu đơn hàng lâu dài không lo mất khi restart container
      - ./backend/orders.json:/app/orders.json
    restart: unless-stopped

  # DỊCH VỤ FRONTEND GIAO DIỆN (NGINX)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: shop-nike-frontend:latest
    container_name: shop-nike-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
